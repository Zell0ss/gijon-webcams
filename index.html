<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>San Lorenzo en directo</title>
<style>
/* Layout: una columna de cámaras 16:9, cabecera mínima con hora local y coordenadas de la playa */
:root {
  --bg: #eef1f2;
  --surface: #ffffff;
  --fg: #1d2a30;
  --muted: #5d6d74;
  --line: #d3dadd;
  --accent: #2f6f7e;      /* Cantábrico en día gris */
  --sand: #c9b48a;
  --screen: #142026;
  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1719;
    --surface: #172327;
    --fg: #e3eaec;
    --muted: #93a4aa;
    --line: #26363b;
    --accent: #6fb3c2;
    --sand: #b9a57c;
    --screen: #0a1013;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.45 var(--font-ui);
  padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
}
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }

header { display: grid; gap: 4px; }
.eyebrow {
  font: 12px/1 var(--font-data);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  margin: 0;
  font-size: clamp(26px, 6vw, 40px);
  line-height: 1.05;
  letter-spacing: -.02em;
  text-wrap: balance;
}
h1 span { color: var(--accent); }
.meta {
  display: flex; flex-wrap: wrap; gap: 6px 16px;
  font: 13px/1.3 var(--font-data);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.meta b { color: var(--fg); font-weight: 600; }

.cams { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 900px) {
  .cams { grid-template-columns: 1fr 1fr; }
  .cam:first-child { grid-column: 1 / -1; }
}

.cam { display: grid; gap: 8px; min-width: 0; }
.cam-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
}
.cam-head h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.cam-head small {
  font: 12px/1 var(--font-data); color: var(--muted); white-space: nowrap;
}
.screen {
  position: relative;
  aspect-ratio: 16 / 9;
  max-width: 100%;
  background: var(--screen);
  border-radius: 6px;
  overflow: hidden;
}
.screen > iframe, .screen > video, .screen > img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; object-fit: cover; display: block;
}
.empty {
  position: absolute; inset: 0;
  display: grid; place-content: center; gap: 10px;
  text-align: center; padding: 16px;
  color: #c8d4d8;
  /* horizonte: cielo, línea de mar y arena */
  background:
    linear-gradient(to bottom, transparent 62%, rgba(201,180,138,.18) 62%, rgba(201,180,138,.18) 100%),
    linear-gradient(to bottom, #22343b 0%, #1a2a30 58%, #2f6f7e 58.6%, #1b3a42 62%);
}
.empty p { margin: 0; font-size: 14px; max-width: 32ch; }
.empty .tag {
  justify-self: center;
  font: 11px/1 var(--font-data); letter-spacing: .08em; text-transform: uppercase;
  padding: 5px 8px; border-radius: 3px;
  background: rgba(0,0,0,.35); color: var(--sand);
}
.live {
  position: absolute; top: 10px; right: 10px; pointer-events: none;
  font: 11px/1 var(--font-data); letter-spacing: .08em; text-transform: uppercase;
  padding: 5px 8px 5px 20px; border-radius: 3px;
  background: rgba(0,0,0,.5); color: #fff;
}
.live::before {
  content: ""; position: absolute; left: 8px; top: 50%;
  width: 6px; height: 6px; margin-top: -3px; border-radius: 50%;
  background: #e05a4f;
}
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  appearance: none; cursor: pointer;
  font: 13px/1 var(--font-ui);
  padding: 9px 12px; border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--surface); color: var(--fg);
  text-decoration: none;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }

footer { font-size: 12px; color: var(--muted); }
footer a { color: inherit; }

@media (prefers-reduced-motion: no-preference) {
  .live::before { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Gijón · Asturies</div>
    <h1>Playa de <span>San Lorenzo</span></h1>
    <div class="meta">
      <span>Hora en Gijón <b id="clock">--:--</b></span>
      <span>43.54° N · 5.68° W</span>
    </div>
  </header>

  <main class="cams" id="cams"></main>

  <footer>
    Cámaras de sus propietarios: Tablas Surf Shop y Webcams de Asturias. Si una no carga, usa «Ver en la web original».
  </footer>
</div>

<script>
/*
 * CONFIGURACIÓN
 * Rellena `src` y `type` de cada cámara cuando tengamos el stream real.
 *   type: "hls"     → URL .m3u8 (Safari/iOS lo reproduce nativo; resto usa hls.js desde cdnjs)
 *         "youtube" → ID del vídeo o URL de embed de YouTube
 *         "iframe"  → URL de un reproductor embebible
 *         "image"   → URL de imagen fija; se refresca cada `refresh` segundos
 *   Con src vacío se muestra el estado "pendiente" y el enlace a la web original.
 */
const CAMS = [
  {
    name: "La bahía",
    where: "Tablas Surf Shop",
    page: "https://www.tablassurfshop.com/en/webcam_bahia",
    type: "iframe",
    src: "https://v.angelcam.com/iframe?v=vboykjz9r8"
  },
  {
    name: "El Tostaderu",
    where: "Webcams de Asturias",
    page: "https://www.webcamsdeasturias.com/asturias/centro/gijon/gijon/playa-de-san-lorenzo-el-tostaderu-hd/133/",
    type: "iframe",
    src: "https://rtsp.me/embed/67Q26etY/"
  },
  {
    name: "La Escalerona",
    where: "Webcams de Asturias",
    page: "https://www.webcamsdeasturias.com/asturias/centro/gijon/gijon/la-escalerona-playa-de-san-lorenzo-hd/148/",
    type: "iframe",
    src: "https://rtsp.me/embed/akBSN4td/"
  }
];

const HLS_JS = "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js";
let hlsLoading = null;

function loadHlsJs() {
  if (window.Hls) return Promise.resolve(window.Hls);
  if (!hlsLoading) {
    hlsLoading = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = HLS_JS;
      s.onload = () => resolve(window.Hls);
      s.onerror = () => reject(new Error("hls.js no disponible"));
      document.head.appendChild(s);
    });
  }
  return hlsLoading;
}

function youtubeEmbed(src) {
  const m = src.match(/(?:v=|youtu\.be\/|embed\/|live\/)([\w-]{11})/);
  const id = m ? m[1] : src;
  return "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&mute=1&playsinline=1";
}

function emptyState(cam, msg) {
  const d = document.createElement("div");
  d.className = "empty";
  d.innerHTML = '<span class="tag"></span><p></p>';
  d.querySelector(".tag").textContent = msg.tag;
  d.querySelector("p").textContent = msg.text;
  return d;
}

function mount(cam, screen) {
  screen.replaceChildren();
  if (cam._timer) { clearInterval(cam._timer); cam._timer = null; }
  if (cam._hls) { cam._hls.destroy(); cam._hls = null; }

  if (!cam.src) {
    screen.append(emptyState(cam, {
      tag: "Stream pendiente",
      text: "Falta la URL del vídeo de esta cámara. Mientras tanto, ábrela en su web."
    }));
    return;
  }

  const badge = document.createElement("span");
  badge.className = "live";
  badge.textContent = "Directo";

  if (cam.type === "image") {
    const img = document.createElement("img");
    img.alt = "Vista de " + cam.name;
    const tick = () => {
      img.src = cam.src + (cam.src.includes("?") ? "&" : "?") + "t=" + Date.now();
    };
    img.onerror = () => screen.replaceChildren(emptyState(cam, {
      tag: "Sin imagen", text: "La cámara no responde ahora mismo."
    }));
    tick();
    cam._timer = setInterval(tick, (cam.refresh || 30) * 1000);
    screen.append(img);
    return;
  }

  if (cam.type === "youtube" || cam.type === "iframe") {
    const f = document.createElement("iframe");
    f.src = cam.type === "youtube" ? youtubeEmbed(cam.src) : cam.src;
    f.allow = "autoplay; fullscreen; picture-in-picture";
    f.allowFullscreen = true;
        f.title = cam.name;
    screen.append(f, badge);
    return;
  }

  if (cam.type === "hls") {
    const v = document.createElement("video");
    v.muted = true; v.autoplay = true; v.playsInline = true; v.controls = true;
    screen.append(v, badge);
    const fail = () => screen.replaceChildren(emptyState(cam, {
      tag: "Sin señal", text: "No se pudo cargar el vídeo. Prueba en la web original."
    }));
    if (v.canPlayType("application/vnd.apple.mpegurl")) {
      v.src = cam.src;
      v.onerror = fail;
    } else {
      loadHlsJs().then(Hls => {
        if (!Hls || !Hls.isSupported()) return fail();
        const h = new Hls();
        cam._hls = h;
        h.on(Hls.Events.ERROR, (_, data) => { if (data.fatal) fail(); });
        h.loadSource(cam.src);
        h.attachMedia(v);
      }).catch(fail);
    }
    return;
  }

  screen.append(emptyState(cam, { tag: "Tipo desconocido", text: "Revisa el campo type." }));
}

function render() {
  const root = document.getElementById("cams");
  CAMS.forEach((cam, i) => {
    const sec = document.createElement("section");
    sec.className = "cam";
    sec.innerHTML =
      '<div class="cam-head"><h2></h2><small></small></div>' +
      '<div class="screen"></div>' +
      '<div class="actions">' +
        '<button class="btn" type="button" id="reload-' + i + '">Recargar</button>' +
        '<a class="btn primary" target="_blank" rel="noopener">Ver en la web original</a>' +
      '</div>';
    sec.querySelector("h2").textContent = cam.name;
    sec.querySelector("small").textContent = cam.where;
    sec.querySelector("a").href = cam.page;
    const screen = sec.querySelector(".screen");
    sec.querySelector("button").addEventListener("click", () => mount(cam, screen));
    root.append(sec);
    mount(cam, screen);
  });
}

function clock() {
  const t = new Intl.DateTimeFormat("es-ES", {
    timeZone: "Europe/Madrid", hour: "2-digit", minute: "2-digit"
  }).format(new Date());
  document.getElementById("clock").textContent = t;
}

render();
clock();
setInterval(clock, 30000);
</script>
</body>
</html>
